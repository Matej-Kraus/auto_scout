name: hunt

# VYPNUTO (8/2026): projekt bezi jen lokalne — vsechny portaly vcetne mobile.de
# stahuje `scripts/run_daily_local.py` (launchd 1x denne) do local.db, kterou cte
# dashboard na localhostu. Hodinovy cron do Neonu uz nikdo necetl, takze jen
# spotreboval Actions minuty a plnil starou DB.
#
# Zapnuti zpet = odkomentovat `schedule` (a zkontrolovat DATABASE_URL secret).
# Rucne jde workflow spustit kdykoliv pres Actions -> hunt -> Run workflow.
on:
  # schedule:
  #   - cron: "0 * * * *"   # kazdou celou hodinu
  workflow_dispatch:

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # Playwright jen kdyz chces Mobile.de (z cloud IP casto padá — viz §8).
      # Odkomentuj nasledujici dva kroky pro zapnuti:
      # - run: pip install -e ".[playwright]"
      # - run: python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Telegram (volitelne) — necht prazdne, pokud nepouzivas
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_ENABLED: ${{ vars.NOTIFY_ENABLED || 'false' }}
          # Email notifikace (vychozi vypnuto — web je hlavni rozhrani;
          # zapnes Actions Variable EMAIL_ENABLED=true + SMTP secrets)
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DEAL_THRESHOLD: ${{ vars.DEAL_THRESHOLD || '0.10' }}
        run: python -m app.run_once
